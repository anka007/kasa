<style>
:root{--zemin:#e4e8ec;--kart:#f7f8f9;--ink:#13202b;--soluk:#5b6a77;--cizgi:#c9d0d7;--park:#0d4ea6;--parkAcik:#dbe7f8;--sari:#f4b400;--su:#0a8f9c;--suAcik:#d6eff1;--asfalt:#36414a;--yesil:#1f7f48;--kirmizi:#c4352b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--zemin);color:var(--ink);font:400 15px/1.35 'Barlow',system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
h1,h2,h3,.num,.plaka{font-family:'Barlow Condensed',sans-serif}
button{font-family:inherit;cursor:pointer}
.ust{position:sticky;top:0;z-index:20;background:var(--park);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between}
.ust h1{font-size:23px;font-weight:700}
.durum{display:flex;align-items:center;gap:7px;font-size:13px;opacity:.95}
.nokta{width:9px;height:9px;border-radius:50%;background:#5ee08f}
.nokta.kapali{background:#f4b400}
.sayfa{display:none;padding:12px;max-width:560px;margin:0 auto}
.sayfa.on{display:block}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:10px;padding:12px;margin-bottom:10px}
.kart.su{border-left:5px solid var(--su)}
.kart.pasif{opacity:.7}
.bas{font-size:21px;font-weight:600;margin:16px 0 8px}
.soluk{color:var(--soluk);font-size:13px}
.btn{border:0;border-radius:8px;padding:12px 14px;font-weight:600;font-size:15px;background:var(--park);color:#fff}
.btn.ikincil{background:#fff;color:var(--park);border:1.5px solid var(--park)}
.btn.sari{background:var(--sari);color:#1b1500}
.btn.su{background:var(--su)}
.btn.tehlike{background:#fff;color:var(--kirmizi);border:1.5px solid var(--kirmizi)}
.btn.tam{width:100%}
.btn.kucuk{padding:7px 11px;font-size:13px}
.satirBtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--cizgi);border-radius:8px;background:#fff;font:400 16px 'Barlow',sans-serif;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--park);border-color:var(--park)}
label{display:block;font-size:13px;color:var(--soluk);margin:11px 0 4px}
.cips{display:flex;gap:6px;flex-wrap:wrap}
.cip{border:1.5px solid var(--cizgi);background:#fff;border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;color:var(--ink)}
.cip.on{background:var(--park);border-color:var(--park);color:#fff}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ozet{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.doluluk b{font:700 40px/1 'Barlow Condensed',sans-serif}
.doluluk span{font-size:15px;color:var(--soluk);margin-left:4px}
.gelirNot{text-align:right;font-size:13px;color:var(--soluk)}
.gelirNot b{display:block;font:600 22px 'Barlow Condensed',sans-serif;color:var(--yesil)}
.arama{display:flex;gap:8px}
.arama input{flex:1}
.otopark{background:var(--asfalt);border-radius:12px;padding:10px 6px 12px 0;margin-top:10px}
.izgara{display:grid;grid-template-columns:repeat(4,1fr);border-right:3px solid #e9edf0}
.yer{position:relative;min-height:76px;border:0;border-left:3px solid #e9edf0;border-bottom:2px dashed rgba(233,237,240,.16);background:transparent;color:#e9edf0;padding:6px 3px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px}
.yer .no{font:600 22px 'Barlow Condensed',sans-serif;opacity:.4}
.yer .no2{position:absolute;top:3px;left:7px;font-size:10px;opacity:.6}
.yer.dolu{background:rgba(244,180,0,.13)}
.yer.bul{outline:3px solid var(--sari);outline-offset:-3px}
.yer .plaka{font-size:12px;padding:0 3px;border-left-width:5px}
.gecen{font-size:11px;font-weight:500;color:var(--sari)}
.abe{font-size:10px;color:#9cc4ff;border:1px solid #9cc4ff;border-radius:3px;padding:0 3px}
.plaka{display:inline-block;background:#fff;color:#0c0c0c;border:1px solid #1d2a36;border-left:7px solid #0b3b99;border-radius:3px;padding:0 6px;font-weight:600;font-size:14px;line-height:1.5;letter-spacing:.3px;white-space:nowrap}
.plakaBuyuk{text-align:center;margin:6px 0 10px}

.satir{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--cizgi)}
.satir span{color:var(--soluk)}
.not{border-radius:8px;padding:9px 11px;font-size:13px;margin:10px 0}
.not.mavi{background:var(--parkAcik);color:#0a3a7e}
.not.uyari{background:#fdecea;color:var(--kirmizi)}
.not.suc{background:var(--suAcik);color:#06626b}
.ustSatir{display:flex;justify-content:space-between;align-items:center;gap:8px}
.iri{font-weight:600;font-size:16px}
.kalan{font:700 30px/1 'Barlow Condensed',sans-serif;text-align:right}

.cubuk{height:6px;background:var(--cizgi);border-radius:3px;margin:9px 0 2px;overflow:hidden}
.cubuk i{display:block;height:100%;background:var(--su)}

.log.on{display:block}
.log div{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.seg{display:flex;background:#d3d9df;border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--soluk)}
.seg button.on{background:#fff;color:var(--park);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--kart);border-top:1px solid var(--cizgi);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--soluk);font-weight:500;font-size:11px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--park);box-shadow:inset 0 3px 0 var(--sari)}
.perde{position:fixed;inset:0;background:rgba(19,32,43,.55);z-index:50;display:none;align-items:flex-end}
.perde.on{display:flex}
.sheet{background:var(--kart);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheetUst{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sheetUst h2{font-size:25px;font-weight:700}
.kapat{border:0;background:#dfe4e9;border-radius:50%;width:34px;height:34px;font-size:22px;line-height:1;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.giris{position:fixed;inset:0;z-index:100;background:var(--zemin);display:flex;align-items:center;justify-content:center;padding:20px}
.girisKutu{width:100%;max-width:380px;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:24px 20px}
.pTabela{width:68px;height:68px;border-radius:12px;background:var(--park);color:#fff;font:700 50px/68px 'Barlow Condensed',sans-serif;text-align:center;margin:0 auto 12px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--park)}
.girisKutu h1{text-align:center;font-size:28px}
.girisKutu p{text-align:center}
.satirSag{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--cizgi);gap:8px}
.satirSag .sol{min-width:0}
.satirSag .sag{font:600 19px 'Barlow Condensed',sans-serif;white-space:nowrap}
.gelir{color:var(--yesil)}
.gider{color:var(--kirmizi)}
.net{font:700 40px/1 'Barlow Condensed',sans-serif}
.cipSatir{margin-bottom:10px}
.hzSatir{border-bottom:1px solid var(--cizgi);padding:10px 0}
.hzSatir .uc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.etiket{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--cizgi);border-radius:999px;padding:6px 8px 6px 12px;margin:0 6px 6px 0;font-size:14px}
.etiket button{border:0;background:none;font-size:18px;line-height:1;color:var(--soluk)}
.onay{display:flex;align-items:center;gap:9px;margin:0;color:var(--ink);font-size:14px}
.onay input{width:20px;height:20px}
.ucr{font:600 14px 'Barlow Condensed',sans-serif;color:#fff}
.durumEt{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:600}
.durumEt.yesil{background:#dff1e6;color:#1f7f48}
.durumEt.uyari{background:#fff1cf;color:#8a5a00}
.durumEt.gider{background:#fdecea;color:#c4352b}
.ayNav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.ayNav b{font:600 21px 'Barlow Condensed',sans-serif}
</style>
</head>

<script>
// ===================== YAPILANDIRMA =====================
const FB={apiKey:"AIzaSyD46X6QMZ7qeEAgramNErgRiF6cw7oMOtQ",authDomain:"otopark-ttakip.firebaseapp.com",projectId:"otopark-ttakip",storageBucket:"otopark-ttakip.firebasestorage.app",messagingSenderId:"1052767673165",appId:"1:1052767673165:web:4b065dadf94860a8a2b504"};

// Firebase giriş ve çok kullanıcılı mod: false = yerel mod (giriş yok, veri bu cihazda), true = Firebase
const FIREBASE_KULLAN=true;

// ===================== YARDIMCILAR =====================
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=v=>'₺'+(Number(v)||0).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:2});
const p2=n=>String(n).padStart(2,'0');
const tarihKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const saatStr=ms=>{const d=new Date(ms);return p2(d.getHours())+':'+p2(d.getMinutes())};
const anahtarTarih=key=>{const a=key.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],0,0,0,0)};
const gunBas=key=>anahtarTarih(key).getTime();
const gunSon=key=>{const d=anahtarTarih(key);d.setHours(23,59,59,999);return d.getTime()};
const tarihGoster=key=>{const a=key.split('-');return a[2]+'.'+a[1]+'.'+a[0]};
const yeniId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function sureStr(dk){dk=Math.max(0,Math.floor(dk));const g=Math.floor(dk/1440),s=Math.floor((dk%1440)/60),m=dk%60;return (g?g+' gün ':'')+(s?s+' sa ':'')+m+' dk'}
function plakaNorm(s){return String(s||'').toUpperCase().replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ç/g,'C').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/[^A-Z0-9]/g,'')}
function plakaFmt(n){const m=/^(\d{2})([A-Z]{1,3})(\d{2,4})$/.exec(n||'');return m?m[1]+' '+m[2]+' '+m[3]:(n||'')}
function plakaHtml(n){return '<span class="plaka">'+esc(plakaFmt(n))+'</span>'}
function gunEkle(key,n){const d=anahtarTarih(key);d.setDate(d.getDate()+n);return tarihKey(d.getTime())}
const ODEME={nakit:'Nakit',kart:'Kart',havale:'Havale',abonelik:'Abonelik',paket:'Paket',cari:'Cari'};
const SINIF={binek:'Binek',suv:'SUV',ticari:'Ticari'};

// ===================== DURUM =====================
function varsayilanAyar(){return{
  tarife:{ucretsizDk:10,ilkSaat:60,sonrakiSaat:40,gunlukMax:300,kapasite:40,aboneAylik:1500,aboneHaftalik:450},
  hizmetler:[
    {id:'h1',isim:'Dış yıkama',fiyat:{binek:150,suv:200,ticari:250}},
    {id:'h2',isim:'İç temizlik',fiyat:{binek:200,suv:250,ticari:300}},
    {id:'h3',isim:'İç ve dış yıkama',fiyat:{binek:300,suv:400,ticari:500}},
    {id:'h4',isim:'Detaylı temizlik',fiyat:{binek:1500,suv:1800,ticari:2200}}
  ],
  giderKat:['Personel','Elektrik','Su','Kimyasal ve malzeme','Kira','Bakım','Diğer'],
  personel:[],calisanlar:[],yoneticiler:[],ownerEmail:''}}
const D={ayar:varsayilanAyar(),pk:[],ab:[],yk:[],pkt:[],stok:[],mus:[],musKasa:[],kasaBugun:[],kasaRapor:[]};
const SEC={};
let db=null,auth=null,user=null,rol='admin',aktif='park',uyeTab='park',kPer='ay',kTur='hepsi',kBas='',kSon='',aranan='';
let ySinif='binek',yPaket=null,yPaketRed=false,ykSek='is',sarfListe=[];const stokGecmisHtml={};
const unsubs=[];let unsubBugun=null,unsubRapor=null,unsubMusKasa=null,bugunKey='';
let sheetTur='',musAy='',musSecili=null,musAra='',tazeleSay=0,sonTazele=0,uygCalisiyor=false;

function aktifAbone(pl){const b=tarihKey(Date.now());return D.ab.find(a=>a.plaka===pl&&a.baslangic<=b&&a.bitis>=b)||null}

function ucretHesapla(girisMs,cikisMs){
  const t=D.ayar.tarife;
  const dk=Math.max(1,Math.ceil((cikisMs-girisMs)/60000));
  if(dk<=t.ucretsizDk)return 0;
  const saatBaz=m=>{if(m<=0)return 0;const sa=Math.ceil(m/60);return t.ilkSaat+(sa-1)*t.sonrakiSaat};
  if(!(t.gunlukMax>0))return saatBaz(dk);
  const gun=Math.floor(dk/1440),kalan=dk-gun*1440;
  return gun*t.gunlukMax+Math.min(saatBaz(kalan),t.gunlukMax);
}

function ucretDetay(g,c){
  const t=D.ayar.tarife;
  const dk=Math.max(1,Math.ceil((c-g)/60000));
  if(dk<=t.ucretsizDk)return 'Ücretsiz süre içinde ('+t.ucretsizDk+' dk)';
  const gun=t.gunlukMax>0?Math.floor(dk/1440):0;
  const kalan=dk-gun*1440;
  const sa=Math.ceil(kalan/60);
  const p=[];
  if(gun>0)p.push(gun+' gün x '+para(t.gunlukMax));
  if(kalan>0){
    const ham=t.ilkSaat+(sa-1)*t.sonrakiSaat;
    if(t.gunlukMax>0&&ham>t.gunlukMax)p.push('günlük üst sınır '+para(t.gunlukMax));
    else p.push(sa>1?para(t.ilkSaat)+' + '+(sa-1)+' x '+para(t.sonrakiSaat):para(t.ilkSaat)+' (ilk saat)');
  }
  return p.join(' + ');
}

}

// ===================== YEREL VERİTABANI (Firebase yokken) =====================
function yerelDb(){
  const KEY='op_yerel_v1';
  let veri={};
  try{veri=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){veri={}}
  const dinle=[];
  const kop=v=>v===undefined?v:JSON.parse(JSON.stringify(v));
  const kaydet=()=>{try{localStorage.setItem(KEY,JSON.stringify(veri))}catch(e){hata(e)}};
  const bildir=()=>dinle.slice().forEach(f=>f());
  const derin=(h,k)=>{Object.keys(k).forEach(a=>{const v=k[a];if(v&&typeof v==='object'&&!Array.isArray(v)&&h[a]&&typeof h[a]==='object'&&!Array.isArray(h[a]))derin(h[a],v);else h[a]=kop(v)})};
  function uygula(op){
    const t=veri[op.kol]=veri[op.kol]||{};
    if(op.t==='set'){if(op.opt&&op.opt.merge&&t[op.id])derin(t[op.id],op.obj);else t[op.id]=kop(op.obj)}
    else if(op.t==='update'){if(!t[op.id])throw new Error('Kayıt bulunamadı');Object.keys(op.obj).forEach(a=>{const v=op.obj[a];if(v&&typeof v==='object'&&v.__inc!==undefined)t[op.id][a]=(Number(t[op.id][a])||0)+v.__inc;else t[op.id][a]=kop(v)})}
    else if(op.t==='delete'){delete t[op.id]}
  }
  function calistir(ops){const y=kop(veri);try{ops.forEach(uygula)}catch(e){veri=y;return Promise.reject(e)}kaydet();bildir();return Promise.resolve()}
  function abone(f){let acik=true;const g=()=>{if(acik)f()};dinle.push(g);setTimeout(g,0);return()=>{acik=false;const i=dinle.indexOf(g);if(i>=0)dinle.splice(i,1)}}
  function kars(x,op,v){if(x===undefined||x===null)return false;if(op==='==')return x===v;if(op==='>=')return x>=v;if(op==='<=')return x<=v;if(op==='>')return x>v;if(op==='<')return x<v;return false}
  function sorgu(kol,fl){return{
    where(a,op,v){return sorgu(kol,fl.concat([[a,op,v]]))},
    get(){const t=veri[kol]||{};return Promise.resolve({docs:Object.keys(t).filter(id=>fl.every(f=>kars(t[id][f[0]],f[1],f[2]))).map(id=>({id:id,data:()=>kop(t[id])}))})},
    onSnapshot(cb){return abone(()=>{
      const t=veri[kol]||{};
      const docs=Object.keys(t).filter(id=>fl.every(f=>kars(t[id][f[0]],f[1],f[2]))).map(id=>({id:id,data:()=>kop(t[id])}));
      cb({docs:docs,metadata:{fromCache:false}});
    })}
  }}
  function docRef(kol,id){return{
    kol:kol,id:id,
    set(obj,opt){return calistir([{t:'set',kol:kol,id:id,obj:obj,opt:opt}])},
    update(obj){return calistir([{t:'update',kol:kol,id:id,obj:obj}])},
    delete(){return calistir([{t:'delete',kol:kol,id:id}])},
    onSnapshot(cb){return abone(()=>{const o=(veri[kol]||{})[id];cb({exists:o!==undefined,data:()=>kop(o),metadata:{fromCache:false}})})}
  }}
  window.addEventListener('storage',e=>{if(e.key===KEY){try{veri=JSON.parse(e.newValue||'{}')||{}}catch(x){veri={}}bildir()}});
  return{
    collection(kol){return Object.assign(sorgu(kol,[]),{doc:id=>docRef(kol,id)})},
    batch(){const ops=[];const b={
      set(r,obj,opt){ops.push({t:'set',kol:r.kol,id:r.id,obj:obj,opt:opt});return b},
      update(r,obj){ops.push({t:'update',kol:r.kol,id:r.id,obj:obj});return b},
      delete(r){ops.push({t:'delete',kol:r.kol,id:r.id});return b},
      commit(){return calistir(ops)}};return b},
    _al(){return kop(veri)},
    _ver(o){veri=kop(o);kaydet();bildir()}
  };
}

function fbBaslat(){
  if(typeof firebase==='undefined'){girisGoster(false);$('girisDurum').textContent='Firebase yüklenemedi. İnternet bağlantısını kontrol edin ve sayfayı https adresinden açın.';return}
  firebase.initializeApp(FB);
  auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const dinleAuth=()=>auth.onAuthStateChanged(u=>{
    if(u){
      const ayni=uygCalisiyor&&user&&user.uid===u.uid;
      user=u;
      if(!ayni)uygulamaBaslat();
    }else{user=null;uygCalisiyor=false;durdur();girisGoster(false);$('giris').style.display='flex'}
  });
  // Oturumu bu cihazda kalıcı tut (sekme veya tarayıcı kapansa da çıkış yapma)
  try{auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(dinleAuth,dinleAuth)}catch(e){dinleAuth()}
}

function cikisKaydet(id,abFlag){

function yPaketDeg(){

  else{yPaket=null;yPaketRed=true}

    '<label>Yıkama bitiş tarihi ve saati</label><input id="bayTar" type="datetime-local" value="'+tarihKey(j.bekleBas||Date.now())+'T'+saatStr(j.bekleBas||Date.now())+'">'+
    '<div class="soluk">Yıkamayı ne zaman bitirdiyseniz onu seçin. Gelir (nakit veya cari) bu tarihe işlenir. Teslim tarihi ayrıca teslim ettiğinizde kaydedilir.</div>'+
    '<button class="btn su tam" style="margin-top:14px" onclick="yikamaBayKaydet(\''+id+'\')">Kaydet</button>'+
    (j.bay?'<div style="height:8px"></div><button class="btn tehlike tam" onclick="yikamaBayKaldir(\''+id+'\')">Alandan çıkar</button>':''));
}
function yikamaBayKaydet(id){
  const j=D.yk.find(x=>x.id===id);if(!j)return;
  const n=parseInt($('bayNo').value)||0,kap=parseInt(D.ayar.tarife.kapasite)||0;
  if(n<1||n>kap){toast('1 ile '+kap+' arasında bir alan girin');return}
  const pk=D.pk.find(x=>x.bay===n),yk=D.yk.find(x=>x.id!==id&&x.bay===n);
  if(pk||yk){toast(n+' nolu alan dolu ('+plakaFmt((pk||yk).plaka)+')');return}

  if(isNaN(bt)||bt>Date.now()+60000){toast('Yıkama bitiş zamanı geçerli olmalı (ileri tarih olamaz)');return}

  db.collection('op_yk').doc(id).update(o).catch(hata);
  sheetKapat();toast(n+' nolu alana alındı');
}
function yikamaBayKaldir(id){

  sheetKapat();toast('Alandan çıkarıldı');
}
function teslimAc(id){
  const j=D.yk.find(x=>x.id===id);if(!j)return;
  const p=j.paketId?D.pkt.find(x=>x.id===j.paketId):null;

  sheetAc('Teslim',

    '<div class="satir"><span>Hizmet</span><b>'+esc(j.hizmet)+'</b></div>'+
    '<div class="satir"><span>Sınıf</span><b>'+esc(SINIF[j.sinif]||'')+'</b></div>'+
    '<div class="satir"><span>Süre</span><b>'+sureStr((Date.now()-j.giris)/60000)+'</b></div>'+(j.bay?'<div class="satir"><span>Otopark alanı</span><b>'+j.bay+' nolu alan, '+sureStr((Date.now()-(j.bekleBas||j.giris))/60000)+' bekledi (ücretsiz)</b></div><div class="satir"><span>Yıkama bitişi</span><b>'+tarihGoster(tarihKey(j.bekleBas||j.giris))+' '+saatStr(j.bekleBas||j.giris)+'</b></div>':'')+sarfNotu(j)+
    (paketli?
      '<div class="not suc">Paket: '+esc(p.isim)+'. Kalan hak '+p.kalan+', teslimden sonra '+(p.kalan-1)+' olacak. Ödeme alınmaz.</div>'+
      '<button class="btn su tam" onclick="teslimKaydet(\''+id+'\')">Teslim et</button>':
      '<label>Müşteri (isteğe bağlı)</label>'+musSecimHtml('tMus',mid,'tOdeme')+
      '<label>Tutar</label><input id="tTutar" type="number" inputmode="decimal" value="'+(j.fiyat||0)+'">'+
      '<label>Ödeme</label>'+odemeCips('tOdeme',mid?'cari':'nakit',true)+
      '<button class="btn su tam" style="margin-top:14px" onclick="teslimKaydet(\''+id+'\')">Tahsil et ve teslim et</button>')+
    '<div style="height:8px"></div>'+
    '<button class="btn tehlike tam" onclick="yikamaIptal(\''+id+'\')">İşi iptal et</button>');
}
function teslimKaydet(id){
  const j=D.yk.find(x=>x.id===id);if(!j)return;
  const p=j.paketId?D.pkt.find(x=>x.id===j.paketId):null;
  const paketli=!!(p&&p.kalan>0);
  const now=Date.now();
  const tEl=$('tTutar');
  const tutar=paketli?0:Math.max(0,parseFloat(tEl?tEl.value:0)||0);
  const tm=$('tMus'),mid=tm?tm.value:(j.musId||''),mm=mid?D.mus.find(x=>x.id===mid):null;
  const odeme=paketli?'paket':(SEC.tOdeme||'nakit');
  if(odeme==='cari'&&!mm){toast('Cari ödeme için müşteri seçin');return}
  const b=db.batch();
  b.set(db.collection('op_kasa').doc('k_'+id),{tarih:(j.bekleBas||(j.tarihli?j.giris:now)),teslim:now,tur:'yikama',yon:'gelir',tutar:tutar,odeme:odeme,plaka:j.plaka,hizmet:j.hizmet,sinif:j.sinif,paketId:j.paketId||null,giris:j.giris,bay:j.bay||0,bekleBas:j.bekleBas||0,kisi:j.kisi||'',musId:mm?mm.id:'',musAd:mm?mm.ad:'',ekleyen:user.email});
  musGuncelle(b,mm,j.plaka,odeme==='cari'?tutar:0);
  if(paketli){
    const log=(p.log||[]).concat([{tarih:now,hizmet:j.hizmet,sinif:j.sinif}]);
    b.update(db.collection('op_pkt').doc(p.id),{kalan:p.kalan-1,log:log});
  }
  const hzm=D.ayar.hizmetler.find(x=>x.id===j.hizmetId);
  ((hzm&&hzm.sarf)||[]).forEach(x=>{
    const st=D.stok.find(y=>y.id===x.stokId);
    if(!st||!(x.miktar>0))return;
    b.update(db.collection('op_stok').doc(st.id),{miktar:artir(-x.miktar)});
    b.set(db.collection('op_stokhr').doc('h_'+yeniId()),{stokId:st.id,tarih:now,tur:'cikis',miktar:x.miktar,aciklama:'Yıkama: '+j.hizmet+' '+plakaFmt(j.plaka),ekleyen:user.email});
  });
  b.delete(db.collection('op_yk').doc(id));
  b.commit().catch(hata);
  sheetKapat();toast(paketli?'Teslim edildi, pakette '+(p.kalan-1)+' hak kaldı':(odeme==='cari'?para(tutar)+' müşteri hesabına yazıldı':para(tutar)+' tahsil edildi'));
}
function yikamaIptal(id){
  if(!confirm('Bu iş silinsin mi?'))return;
  db.collection('op_yk').doc(id).delete().catch(hata);sheetKapat();toast('İş silindi');
}

// ===================== STOK =====================
function sayiStr(v){return (Math.round((Number(v)||0)*1000)/1000).toLocaleString('tr-TR')}
function stokDurum(s){
  if(s.miktar<=0)return['Bitti','gider'];
  if(s.min>0&&s.miktar<=s.min)return['Azaldı','uyari'];
  return['Yeterli','yesil'];
}
function sarfNotu(j){
  const h=D.ayar.hizmetler.find(x=>x.id===j.hizmetId);
  const l=((h&&h.sarf)||[]).map(x=>{const s=D.stok.find(y=>y.id===x.stokId);return(s&&x.miktar>0)?sayiStr(x.miktar)+' '+esc(s.birim)+' '+esc(s.ad):''}).filter(Boolean);
  return l.length?'<div class="not mavi">Stoktan düşecek: '+l.join(', ')+'</div>':'';
}
function stokCiz(){
  const adm=rol==='admin';
  const l=D.stok.slice().sort((a,b)=>String(a.ad).localeCompare(String(b.ad),'tr'));
  $('ykStok').innerHTML=(adm?'<button class="btn tam" onclick="stokEkleAc()">Ürün ekle</button><div style="height:12px"></div>':'')+
    (l.length?l.map(s=>{
      const d=stokDurum(s);
      return '<div class="kart"><div class="ustSatir"><div><div class="iri">'+esc(s.ad)+'</div><div class="soluk">En az '+sayiStr(s.min||0)+' '+esc(s.birim)+'</div></div><div class="kalan">'+sayiStr(s.miktar)+'<small> '+esc(s.birim)+'</small></div></div>'+
        '<div style="margin-top:8px"><span class="durumEt '+d[1]+'">'+d[0]+'</span></div>'+
        '<div class="satirBtn"><button class="btn kucuk" onclick="stokHareketAc(\''+s.id+'\',\'giris\')">Alış ekle</button><button class="btn ikincil kucuk" onclick="stokHareketAc(\''+s.id+'\',\'cikis\')">Kullanım</button><button class="btn ikincil kucuk" onclick="stokGecmis(\''+s.id+'\')">Geçmiş</button>'+(adm?'<button class="btn ikincil kucuk" onclick="stokDuzenleAc(\''+s.id+'\')">Düzenle</button>':'')+'</div>'+
        '<div class="log'+(stokGecmisHtml[s.id]?' on':'')+'" id="sh_'+s.id+'">'+(stokGecmisHtml[s.id]||'')+'</div></div>';
    }).join(''):'<div class="kart soluk">Henüz ürün yok.'+(adm?' Ürün ekleyin, sonra Ayarlar bölümünden her hizmetin ürün sarfını girin.':'')+'</div>');
}
function stokEkleAc(){
  sheetAc('Yeni ürün',
    '<label>Ürün adı</label><input id="seAd" placeholder="Örn. Köpük şampuan" autocomplete="off">'+

function uyeSec(t){uyeTab=t;$('segPark').classList.toggle('on',t==='park');$('segPaket').classList.toggle('on',t==='paket');uyelikCiz()}
function uyelikCiz(){
  const bugun=tarihKey(Date.now());
  if(uyeTab==='park'){
    const l=D.ab.slice().sort((a,b)=>b.bitis.localeCompare(a.bitis));
    $('uyeIc').innerHTML='<button class="btn tam" onclick="aboneAc()">Yeni park aboneliği</button><div style="height:12px"></div>'+
      (l.length?l.map(a=>{
        const bitti=a.bitis<bugun;
        const gun=Math.round((gunBas(a.bitis)-gunBas(bugun))/86400000);
        const durum=bitti?'<span style="color:var(--kirmizi);font-weight:600">Süresi doldu</span>':(gun===0?'<span style="color:var(--yesil);font-weight:600">Bugün bitiyor</span>':'<span style="color:var(--yesil);font-weight:600">'+gun+' gün kaldı</span>');
        return '<div class="kart'+(bitti?' pasif':'')+'"><div class="ustSatir"><div><div class="iri">'+esc(a.isim)+'</div><div style="margin-top:3px">'+plakaHtml(a.plaka)+'</div></div><div style="text-align:right">'+durum+'<div class="soluk">'+tarihGoster(a.baslangic)+' - '+tarihGoster(a.bitis)+'</div></div></div>'+
          '<div class="satirBtn"><button class="btn kucuk" onclick="yenileAc(\''+a.id+'\')">Yenile</button><button class="btn tehlike kucuk" onclick="aboneSil(\''+a.id+'\')">Sil</button></div></div>';
      }).join(''):'<div class="soluk">Henüz abonelik yok.</div>');
  }else{
    const aktifL=D.pkt.filter(x=>x.kalan>0).sort((a,b)=>b.tarih-a.tarih);
    const bitenL=D.pkt.filter(x=>!(x.kalan>0)).sort((a,b)=>b.tarih-a.tarih);
    const kart=p=>{
      const yuzde=p.toplam?Math.round((p.toplam-p.kalan)/p.toplam*100):100;
      const log=(p.log||[]).slice().reverse();
      return '<div class="kart'+(p.kalan>0?'':' pasif')+'"><div class="ustSatir" onclick="logAc(\''+p.id+'\')" style="cursor:pointer"><div><div class="iri">'+esc(p.isim)+'</div><div style="margin-top:3px">'+plakaHtml(p.plaka)+' <span class="soluk">'+esc(p.hizmet||'')+'</span></div></div><div class="kalan">'+p.kalan+'<small>/'+p.toplam+'</small></div></div>'+
        '<div class="cubuk"><i style="width:'+yuzde+'%"></i></div>'+
        '<div class="soluk">'+(p.kalan>0?(p.toplam-p.kalan)+' yıkama yapıldı':'Paket tamamlandı')+'</div>'+
        '<div class="log" id="log_'+p.id+'">'+(log.length?log.map(l=>'<div><span>'+tarihGoster(tarihKey(l.tarih))+' '+saatStr(l.tarih)+'</span><span>'+esc(l.hizmet||'')+(l.sinif?' ('+esc(SINIF[l.sinif]||l.sinif)+')':'')+'</span></div>').join(''):'<div class="soluk">Henüz yıkama yapılmadı.</div>')+'</div>'+
        '<div class="satirBtn">'+(p.kalan>0?'<button class="btn su kucuk" onclick="paketYikama(\''+p.id+'\')">Yıkama başlat</button>':'')+'<button class="btn ikincil kucuk" onclick="logAc(\''+p.id+'\')">Geçmiş</button>'+(rol==='admin'?'<button class="btn tehlike kucuk" onclick="paketSil(\''+p.id+'\')">Sil</button>':'')+'</div></div>';
    };
    $('uyeIc').innerHTML='<button class="btn su tam" onclick="paketAc()">Yeni yıkama paketi sat</button><div style="height:12px"></div>'+
      (aktifL.length?aktifL.map(kart).join(''):'<div class="soluk">Aktif paket yok.</div>')+
      (bitenL.length?'<h3 class="bas">Biten paketler</h3>'+bitenL.map(kart).join(''):'');
  }

// ===================== MÜŞTERİLER =====================
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const ayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)};
const ayAd=k=>{const a=k.split('-');return AYLAR[+a[1]-1]+' '+a[0]};
function ayKaydir(k,n){const a=k.split('-').map(Number);const d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+p2(d.getMonth()+1)}
function ayAralik(k){const a=k.split('-').map(Number);return[new Date(a[0],a[1]-1,1,0,0,0,0).getTime(),new Date(a[0],a[1],0,23,59,59,999).getTime()]}
const topTutar=a=>a.reduce((s,x)=>s+(x.tutar||0),0);

function musKasaDinle(){
  if(unsubMusKasa){unsubMusKasa();unsubMusKasa=null}
  if(!musAy)musAy=ayKey(Date.now());
  const r=ayAralik(musAy);
  unsubMusKasa=db.collection('op_kasa').where('tarih','>=',r[0]).where('tarih','<=',r[1]).onSnapshot(s=>{D.musKasa=mapDocs(s).filter(x=>x.musId);musYenile()},hata);
}
function musYenile(){if(aktif==='mus')musCiz();musDetayYenile()}
function musDetayYenile(){if(sheetTur==='musDetay'&&$('perde').classList.contains('on'))musDetayCiz()}
function musAyDeg(n){musAy=ayKaydir(musAy,n);D.musKasa=[];musKasaDinle();musYenile()}
function musPlakaBul(pl){const m=D.mus.find(x=>(x.plakalar||[]).indexOf(pl)>=0);return m?m.id:''}
function musSecimHtml(id,sel,odemeAd,ekstra){
  const oc=(odemeAd?'musOdemeDeg(\''+id+'\',\''+odemeAd+'\');':'')+(ekstra||'');
  return '<select id="'+id+'"'+(oc?' onchange="'+oc+'"':'')+'><option value="">Müşteri yok</option>'+
    D.mus.slice().sort((a,b)=>String(a.ad).localeCompare(String(b.ad),'tr')).map(m=>'<option value="'+m.id+'"'+(m.id===sel?' selected':'')+'>'+esc(m.ad)+'</option>').join('')+'</select>';
}
function musOdemeDeg(selId,odemeAd){
  const v=$(selId).value,cip=$('cip_'+odemeAd);if(!cip)return;
  const hedef=v?'cari':(SEC[odemeAd]==='cari'?'nakit':SEC[odemeAd]);
  const dugme=[].slice.call(cip.children).find(b=>(b.getAttribute('onclick')||'').indexOf("'"+hedef+"'")>=0);
  if(dugme)cipSec(odemeAd,hedef,dugme);
}
function musGuncelle(b,m,plaka,borcArt){
  if(!m)return;
  const o={};
  if(plaka&&(m.plakalar||[]).indexOf(plaka)<0)o.plakalar=(m.plakalar||[]).concat([plaka]);
  if(borcArt>0)o.borc=artir(borcArt);
  if(Object.keys(o).length)b.update(db.collection('op_mus').doc(m.id),o);
}
function musAyOzet(id){
  const l=D.musKasa.filter(x=>x.musId===id);
  const yk=l.filter(x=>x.tur==='yikama'),pk=l.filter(x=>x.tur==='park'),th=l.filter(x=>x.tur==='tahsilat');
  const hiz=yk.concat(pk);
  return{l:l,yk:yk,pk:pk,th:th,hizTop:topTutar(hiz),cari:topTutar(hiz.filter(x=>x.odeme==='cari')),pesin:topTutar(hiz.filter(x=>x.odeme!=='cari')),tahTop:topTutar(th)};
}
function musCiz(){
  if(!musAy)musAy=ayKey(Date.now());
  const adm=rol==='admin';
  const q=musAra.trim().toLocaleLowerCase('tr'),qp=plakaNorm(musAra);
  let l=D.mus.slice().sort((a,b)=>(adm?((b.borc||0)-(a.borc||0)):0)||String(a.ad).localeCompare(String(b.ad),'tr'));

function musKaydet(id){
  const ad=$('mAd').value.trim();if(!ad){toast('Ad girin');return}
  const pls=[];
  $('mPlaka').value.split(/[,;\n]+/).forEach(s=>{const p=plakaNorm(s);if(p.length>=4&&pls.indexOf(p)<0)pls.push(p)});
  const cakisan=pls.map(p=>{const o=D.mus.find(x=>x.id!==id&&(x.plakalar||[]).indexOf(p)>=0);return o?plakaFmt(p)+' ('+o.ad+')':null}).filter(Boolean);
  if(cakisan.length&&!confirm('Bu plakalar başka müşteride kayıtlı: '+cakisan.join(', ')+'. Yine de kaydedilsin mi?'))return;
  const o={ad:ad,tel:$('mTel').value.trim(),not:$('mNot').value.trim(),plakalar:pls};
  if(id){db.collection('op_mus').doc(id).set(o,{merge:true}).catch(hata);toast('Müşteri güncellendi');musDetayAc(id)}
  else{yaz('op_mus',yeniId(),Object.assign(o,{borc:0,olusturma:Date.now(),ekleyen:user.email}));sheetKapat();toast('Müşteri eklendi')}
}
function musSil(id){

  if(!confirm('"'+m.ad+'" müşterisi silinsin mi? Geçmiş kasa kayıtları silinmez.'))return;
  if((m.borc||0)>0&&!confirm('Bu müşterinin '+para(m.borc)+' ödenmemiş bakiyesi var. Yine de silinsin mi?'))return;

  const pks=Object.keys(pm).sort();

function musTahsilatKaydet(id){
  const m=D.mus.find(x=>x.id===id);if(!m)return;
  const t=parseFloat($('thTutar').value);
  if(!(t>0)){toast('Tutarı girin');return}
  const key=$('thTarih').value||tarihKey(Date.now());
  const a=key.split('-').map(Number),n=new Date();
  const ms=new Date(a[0],a[1]-1,a[2],n.getHours(),n.getMinutes()).getTime();
  const b=db.batch();
  b.set(db.collection('op_kasa').doc('k_'+yeniId()),{tarih:ms,tur:'tahsilat',yon:'tahsilat',tutar:t,odeme:SEC.thOdeme||'nakit',musId:m.id,musAd:m.ad,ekleyen:user.email});
  b.update(db.collection('op_mus').doc(m.id),{borc:artir(-t)});
  b.commit().catch(hata);
  toast(para(t)+' tahsilat kaydedildi');musDetayAc(id);
}
function musBakiyeYenile(id){
  const m=D.mus.find(x=>x.id===id);if(!m)return;
  if(!confirm('Bakiye, müşterinin tüm kasa kayıtlarından yeniden hesaplansın mı?'))return;
  db.collection('op_kasa').where('musId','==',id).get().then(s=>{
    let b=0;
    s.docs.forEach(d=>{const x=d.data();if(x.tur==='tahsilat')b-=x.tutar||0;else if(x.yon==='gelir'&&x.odeme==='cari')b+=x.tutar||0});
    b=Math.round(b*100)/100;
    return db.collection('op_mus').doc(id).update({borc:b}).then(()=>toast('Bakiye: '+para(b)));
  }).catch(hata);
}
function musOzetMetin(m){
  const o=musAyOzet(m.id),s=[];
  s.push(m.ad+' - '+ayAd(musAy)+' hesap özeti','');
  s.push('Yıkama: '+o.yk.length+' araç, otopark: '+o.pk.length+' çıkış','');
  o.yk.concat(o.pk).sort((a,b)=>a.tarih-b.tarih).forEach(x=>s.push(tarihGoster(tarihKey(x.tarih))+'  '+plakaFmt(x.plaka||'')+'  '+(x.tur==='yikama'?(x.hizmet||'Yıkama'):'Otopark')+'  '+para(x.tutar)));
  s.push('','Ay toplamı: '+para(o.hizTop));
  if(o.tahTop>0)s.push('Bu ay yapılan ödeme: '+para(o.tahTop));
  s.push('Güncel bakiye (ödenecek): '+para(Math.max(0,m.borc||0)));
  return s.join('\n');
}
function musPaylas(id){
  const m=D.mus.find(x=>x.id===id);if(!m)return;
  const t=musOzetMetin(m);
  if(navigator.share){navigator.share({text:t}).catch(()=>{})}
  else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function musCsv(id){
  const m=D.mus.find(x=>x.id===id);if(!m)return;
  const o=musAyOzet(m.id);
  const satir=[['Tarih','Saat','Tür','Plaka','Açıklama','Tutar','Ödeme']];
  o.l.slice().sort((a,b)=>a.tarih-b.tarih).forEach(x=>satir.push([tarihGoster(tarihKey(x.tarih)),saatStr(x.tarih),x.tur==='yikama'?'Yıkama':(x.tur==='park'?'Otopark':'Tahsilat'),x.plaka?plakaFmt(x.plaka):'',x.tur==='yikama'?(x.hizmet||''):(x.tur==='park'&&x.giris&&x.cikis?sureStr((x.cikis-x.giris)/60000):''),x.tutar,ODEME[x.odeme]||'']));
  satir.push([],['','','','','Hizmet toplamı',o.hizTop,''],['','','','','Tahsilat',o.tahTop,''],['','','','','Güncel bakiye',m.borc||0,'']);
  const csv='﻿'+satir.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='musteri_'+plakaNorm(m.ad||'musteri')+'_'+musAy+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

// ===================== KASA =====================
function donemHesapla(){
  const b=tarihKey(Date.now());const a=b.split('-').map(Number);
  if(kPer==='bugun'){kBas=b;kSon=b}
  else if(kPer==='hafta'){const d=new Date(a[0],a[1]-1,a[2]);d.setDate(a[2]-((d.getDay()+6)%7));kBas=tarihKey(d.getTime());kSon=b}
  else if(kPer==='ay'){kBas=a[0]+'-'+p2(a[1])+'-01';kSon=b}
}
function donemSec(p){
  kPer=p;
  if(p==='ozel'){kBas=$('kB').value||kBas||tarihKey(Date.now());kSon=$('kS').value||kSon||tarihKey(Date.now());$('kB').value=kBas;$('kS').value=kSon}
  else donemHesapla();
  kasaRaporDinle();kasaCiz();
}
function kOzelDeg(){if($('kB').value&&$('kS').value){kBas=$('kB').value;kSon=$('kS').value;kasaRaporDinle()}}
const TUR_AD={park:'Otopark',yikama:'Yıkama',abone:'Park aboneliği',paket:'Yıkama paketi',gider:'Gider',tahsilat:'Müşteri tahsilatı'};
function girdiBaslik(x){return x.tur==='gider'?(x.kategori||'Gider'):(TUR_AD[x.tur]||x.tur)}
function girdiAlt(x){
  if(x.tur==='gider')return (x.kisi?x.kisi+(x.aciklama?' · ':''):'')+(x.aciklama||'');
  const a=[];
  if(x.plaka)a.push(plakaFmt(x.plaka));
  if(x.musAd)a.push(x.musAd);
  if(x.tur==='yikama'&&x.hizmet)a.push(x.hizmet);
  if(x.tur==='paket'&&x.hizmet)a.push(x.hizmet);
  if(x.tur==='park'&&x.giris&&x.cikis)a.push(sureStr((x.cikis-x.giris)/60000));
  if(x.tur==='abone'&&x.kisi)a.push(x.kisi);
  return a.join('  ');
}
function kTurSec(t){kTur=t;kasaCiz()}

    '<div class="kart"><h3 style="font-size:20px;margin-bottom:4px">Ödeme yöntemi (gelir)</h3>'+

    '<div class="soluk" style="margin-top:6px">Cari satışlar yazıldığı gün gelir sayılır. Tahsilatlar net kazanca ayrıca eklenmez.</div></div>':'');

const XCRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function xCrc(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=XCRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function xZip(dosyalar){
  const enc=new TextEncoder(),parts=[],merkez=[];let ofs=0;
  dosyalar.forEach(f=>{
    const ad=enc.encode(f.ad),veri=enc.encode(f.metin),crc=xCrc(veri);
    const lh=new Uint8Array(30+ad.length),dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0x21,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,veri.length,true);dv.setUint32(22,veri.length,true);dv.setUint16(26,ad.length,true);dv.setUint16(28,0,true);lh.set(ad,30);
    const ch=new Uint8Array(46+ad.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0x21,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,veri.length,true);cv.setUint32(24,veri.length,true);cv.setUint16(28,ad.length,true);cv.setUint32(42,ofs,true);ch.set(ad,46);
    parts.push(lh,veri);merkez.push(ch);ofs+=lh.length+veri.length;
  });
  const mb=merkez.reduce((a,x)=>a+x.length,0),son=new Uint8Array(22),sv=new DataView(son.buffer);
  sv.setUint32(0,0x06054b50,true);sv.setUint16(8,dosyalar.length,true);sv.setUint16(10,dosyalar.length,true);sv.setUint32(12,mb,true);sv.setUint32(16,ofs,true);
  return new Blob(parts.concat(merkez,[son]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xKolon(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function xEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}
function xSayfa(sh){
  let rows='';
  sh.satirlar.forEach((satir,ri)=>{
    let c='';
    satir.forEach((h,ci)=>{
      if(h===null||h===undefined||h==='')return;
      const o=(typeof h==='object')?h:{v:h};
      const ref=xKolon(ci)+(ri+1),s=o.s?' s="'+o.s+'"':'';
      if(typeof o.v==='number'){const v=isFinite(o.v)?o.v:0;c+='<c r="'+ref+'"'+s+'>'+(o.f?'<f>'+xEsc(o.f)+'</f>':'')+'<v>'+v+'</v></c>'}
      else c+='<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xEsc(o.v)+'</t></is></c>';
    });
    rows+='<row r="'+(ri+1)+'">'+c+'</row>';
  });
  const gor=sh.dondur?'<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews>':'<sheetViews><sheetView workbookViewId="0"/></sheetViews>';
  const kol=(sh.genislik&&sh.genislik.length)?'<cols>'+sh.genislik.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>':'';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+gor+kol+'<sheetData>'+rows+'</sheetData></worksheet>';
}

function xlsxOlustur(sayfalar){

let rpMus='',rpBas='',rpSon='',rpTum=[],rpYuk=false;
const r2=n=>Math.round((Number(n)||0)*100)/100;

    '</div><div id="rpSonuc"></div>';

function raporSonucCiz(){if(rpTur==='mus')raporMusSonuc();else raporGenSonuc()}
function raporExcel(){if(rpTur==='mus')raporMusExcel();else raporGenExcel()}
function rpMusDeg(){rpMus=$('rpMusSec').value;rpYukle()}
function rpTarihDeg(){rpBas=$('rpB').value;rpSon=$('rpS').value;rpYenile()}
function rpHizli(t){
  const bugun=tarihKey(Date.now()),a=bugun.split('-').map(Number);
  if(t==='ay'){rpBas=a[0]+'-'+p2(a[1])+'-01';rpSon=bugun}
  else if(t==='gecen'){rpBas=tarihKey(new Date(a[0],a[1]-2,1).getTime());rpSon=tarihKey(new Date(a[0],a[1]-1,0).getTime())}
  else if(t==='30'){rpBas=gunEkle(bugun,-29);rpSon=bugun}
  else if(t==='yil'){rpBas=a[0]+'-01-01';rpSon=bugun}
  $('rpB').value=rpBas;$('rpS').value=rpSon;rpYenile();
}
function rpYukle(){
  rpTum=[];
  if(!rpMus){rpYuk=false;raporSonucCiz();return}
  const id=rpMus;rpYuk=true;raporSonucCiz();
  db.collection('op_kasa').where('musId','==',id).get().then(s=>{
    if(rpMus!==id)return;
    rpTum=mapDocs(s);rpYuk=false;raporSonucCiz();
  }).catch(e=>{rpYuk=false;hata(e);raporSonucCiz()});
}
function musRapor(id){sheetKapat();rpTur='mus';rpMus=id;git('rapor');rpYukle()}
function raporHesapla(){
  const m=D.mus.find(x=>x.id===rpMus);if(!m)return null;
  const b0=gunBas(rpBas),b1=gunSon(rpSon);
  const cariMi=x=>x.yon==='gelir'&&x.odeme==='cari';
  const once=rpTum.filter(x=>x.tarih<b0);
  const don=rpTum.filter(x=>x.tarih>=b0&&x.tarih<=b1).sort((a,b)=>a.tarih-b.tarih);
  const yk=don.filter(x=>x.tur==='yikama'),pk=don.filter(x=>x.tur==='park'),th=don.filter(x=>x.tur==='tahsilat');
  const devir=r2(topTutar(once.filter(cariMi))-topTutar(once.filter(x=>x.tur==='tahsilat')));
  const cari=r2(topTutar(don.filter(cariMi))),tahsilat=r2(topTutar(th));
  const hiz=yk.concat(pk);
  const hm={},am={};
  yk.forEach(x=>{const k=x.hizmet||'Yıkama';const e=hm[k]=hm[k]||{ad:k,adet:0,tutar:0};e.adet++;e.tutar+=x.tutar||0});
  hiz.forEach(x=>{const k=x.plaka||'-';const e=am[k]=am[k]||{plaka:k,yk:0,pk:0,tutar:0};if(x.tur==='yikama')e.yk++;else e.pk++;e.tutar+=x.tutar||0});
  return{m:m,yk:yk,pk:pk,th:th,devir:devir,cari:cari,tahsilat:tahsilat,kalan:r2(devir+cari-tahsilat),
    pesin:r2(topTutar(hiz.filter(x=>!cariMi(x)))),ykTutar:r2(topTutar(yk)),pkTutar:r2(topTutar(pk)),
    farkli:new Set(yk.map(x=>x.plaka)).size,
    hizmetler:Object.keys(hm).map(k=>hm[k]).sort((a,b)=>b.adet-a.adet),
    araclar:Object.keys(am).map(k=>am[k]).sort((a,b)=>(b.yk+b.pk)-(a.yk+a.pk)||String(a.plaka).localeCompare(String(b.plaka)))};
}
function raporMusSonuc(){
  const el=$('rpSonuc');if(!el)return;
  if(!rpMus){el.innerHTML='<div class="soluk" style="padding:4px 2px">Rapor görmek için müşteri seçin.</div>';return}
  if(rpYuk){el.innerHTML='<div class="soluk" style="padding:4px 2px">Kayıtlar yükleniyor…</div>';return}
  if(!rpBas||!rpSon){el.innerHTML='<div class="not uyari">Başlangıç ve bitiş tarihini seçin.</div>';return}
  if(rpBas>rpSon){el.innerHTML='<div class="not uyari">Başlangıç tarihi bitiş tarihinden sonra olamaz.</div>';return}
  const r=raporHesapla();if(!r){el.innerHTML='';return}
  const m=r.m;
  const sat=(a,v,c)=>'<div class="satir"><span>'+a+'</span><b class="'+(c||'')+'">'+v+'</b></div>';
  const bas=(t)=>'<h3 class="bas">'+t+'</h3>';
  let h='<div class="kart"><div class="soluk">'+esc(m.ad)+' · '+tarihGoster(rpBas)+' - '+tarihGoster(rpSon)+'</div>'+
    '<div class="net" style="margin:4px 0 2px">'+r.yk.length+'</div><div class="soluk">yıkama yapıldı ('+r.farkli+' farklı araç)</div>'+
    sat('Yıkama tutarı',para(r.ykTutar))+

let rpTur='genel',rpGen=[],rpGenYuk=false,rpGenAnahtar='',rpKat='',rpKisi='';
function rpYenile(){if(rpTur==='mus')raporSonucCiz();else rpGenGetir()}

function rpFiltre(){const a=$('rpKat'),b=$('rpKisi');rpKat=a?a.value:'';rpKisi=b?b.value:'';raporSonucCiz()}
function rpGenGetir(){
  if(!rpBas||!rpSon||rpBas>rpSon){raporSonucCiz();return}
  const b0=gunBas(rpBas),b1=gunSon(rpSon),an=b0+'_'+b1;
  rpGenYuk=true;rpGenAnahtar=an;raporSonucCiz();
  db.collection('op_kasa').where('tarih','>=',b0).where('tarih','<=',b1).get().then(s=>{
    if(rpGenAnahtar!==an)return;
    rpGen=mapDocs(s);rpGenYuk=false;raporSonucCiz();
  }).catch(e=>{rpGenYuk=false;hata(e);raporSonucCiz()});
}
const giderKisi=x=>x.kisi||(x.kategori==='Personel'?(x.aciklama||''):'');
function genHesapla(){
  const l=rpGen.slice().sort((a,b)=>a.tarih-b.tarih);
  const cariMi=x=>x.yon==='gelir'&&x.odeme==='cari';
  const gel=l.filter(x=>x.yon==='gelir'),gid=l.filter(x=>x.tur==='gider'),th=l.filter(x=>x.tur==='tahsilat');
  const gelir=r2(topTutar(gel)),cari=r2(topTutar(gel.filter(cariMi))),tahsilat=r2(topTutar(th)),gider=r2(topTutar(gid));
  const pesin=r2(gelir-cari);
  const turler=['park','yikama','abone','paket'].map(t=>{const a=gel.filter(x=>x.tur===t);return{ad:TUR_AD[t],adet:a.length,tutar:r2(topTutar(a))}}).filter(x=>x.adet);
  const om={};gel.filter(x=>!cariMi(x)).concat(th).forEach(x=>{const k=ODEME[x.odeme]||x.odeme||'-';om[k]=r2((om[k]||0)+(x.tutar||0))});
  const gk={};gid.forEach(x=>{const k=x.kategori||'Diğer';const e=gk[k]=gk[k]||{ad:k,adet:0,tutar:0};e.adet++;e.tutar=r2(e.tutar+(x.tutar||0))});
  const gun={};
  l.forEach(x=>{const k=tarihKey(x.tarih);const e=gun[k]=gun[k]||{k:k,gelir:0,gider:0};if(x.yon==='gelir')e.gelir+=x.tutar||0;else if(x.tur==='gider')e.gider+=x.tutar||0});
  const mm={};
  gel.filter(x=>x.musId).forEach(x=>{const e=mm[x.musId]=mm[x.musId]||{ad:x.musAd||'-',adet:0,tutar:0,cari:0,tahsilat:0};e.adet++;e.tutar+=x.tutar||0;if(cariMi(x))e.cari+=x.tutar||0});
  th.filter(x=>x.musId).forEach(x=>{const e=mm[x.musId]=mm[x.musId]||{ad:x.musAd||'-',adet:0,tutar:0,cari:0,tahsilat:0};e.tahsilat+=x.tutar||0});
  return{l:l,gel:gel,gid:gid,th:th,gelir:gelir,cari:cari,pesin:pesin,tahsilat:tahsilat,gider:gider,net:r2(gelir-gider),nakit:r2(pesin+tahsilat-gider),
    turler:turler,odemeler:Object.keys(om).map(k=>({ad:k,tutar:om[k]})),
    giderKat:Object.keys(gk).map(k=>gk[k]).sort((a,b)=>b.tutar-a.tutar),
    gunler:Object.keys(gun).sort().map(k=>gun[k]),
    musteriler:Object.keys(mm).map(k=>mm[k]).sort((a,b)=>b.tutar-a.tutar)};
}
function giderSuz(){

function koleksiyonSil(ad){
  return db.collection(ad).get().then(s=>{
    const idler=s.docs.map(d=>d.id),isler=[];
    for(let i=0;i<idler.length;i+=400){
      const b=db.batch();idler.slice(i,i+400).forEach(id=>b.delete(db.collection(ad).doc(id)));
      isler.push(b.commit());
    }
    return Promise.all(isler).then(()=>idler.length);

}

function kasaDuzenleKaydet(id){
  const x=D.kasaRapor.concat(D.kasaBugun).find(y=>y.id===id);if(!x){toast('Kayıt bulunamadı');return}
  const gider=x.tur==='gider',th=x.tur==='tahsilat',park=x.tur==='park',yk=x.tur==='yikama',musOk=park||yk||th;
  const t=parseFloat($('kdTutar').value);
  if(isNaN(t)||t<0){toast('Tutarı girin');return}
  const tarih=dtlMs($('kdTarih').value)||x.tarih;
  if(tarih>Date.now()+60000){toast('Tarih ileri tarihli olamaz');return}
  const odeme=SEC.kdOdeme||x.odeme;
  const o={tutar:t,tarih:tarih,odeme:odeme};
  if(park){const g=dtlMs($('kdGiris').value)||x.giris;if(!(g<tarih)){toast('Giriş zamanı çıkıştan önce olmalı');return}o.giris=g;o.cikis=tarih}
  if(park||yk){const pl=plakaNorm($('kdPlaka').value);if(pl.length<4){toast('Plakayı girin');return}o.plaka=pl}
  if(yk){
    const hv=$('kdHizmet').value;if(hv!=='__mevcut'){const hz=D.ayar.hizmetler.find(h=>h.id===hv);if(hz)o.hizmet=hz.isim}
    o.sinif=$('kdSinif').value;
    if(x.bekleBas&&x.bekleBas===x.tarih)o.bekleBas=tarih;
  }
  if(gider){
    o.kategori=$('kdKat').value;
    const kv=$('kdKisi')?$('kdKisi').value:'';
    o.kisi=(o.kategori==='Personel'&&kv&&kv!=='__yeni')?kv:'';
    o.aciklama=$('kdNot').value.trim();
  }
  let yeniMus=x.musId||'';
  if(musOk){
    const mid=$('kdMus').value||'',mm=mid?D.mus.find(m=>m.id===mid):null;
    o.musId=mm?mm.id:'';o.musAd=mm?mm.ad:'';yeniMus=o.musId;
  }
  if(odeme==='cari'&&!yeniMus){toast('Cari ödeme için müşteri seçin');return}
  const eskiE=kasaEtki(x.tur,x.yon,x.odeme,x.tutar||0),yeniE=kasaEtki(x.tur,x.yon,odeme,t),eskiMus=x.musId||'';
  const var_=m=>m&&D.mus.some(y=>y.id===m);
  const b=db.batch();
  b.update(db.collection('op_kasa').doc(id),o);
  if(eskiMus===yeniMus){
    const d=yeniE-eskiE;
    if(d&&var_(yeniMus))b.update(db.collection('op_mus').doc(yeniMus),{borc:artir(d)});
  }else{
    if(eskiE&&var_(eskiMus))b.update(db.collection('op_mus').doc(eskiMus),{borc:artir(-eskiE)});
    if(yeniE&&var_(yeniMus))b.update(db.collection('op_mus').doc(yeniMus),{borc:artir(yeniE)});
  }
  b.commit().catch(hata);
  sheetKapat();toast('Kayıt güncellendi');
}

  $('ayarIc').innerHTML=
    '<div class="kart"><h3 style="font-size:21px">Otopark tarifesi</h3>'+
    '<div class="iki">'+alan('tUcretsiz','Ücretsiz süre (dk)',t.ucretsizDk)+alan('tKap','Kapasite (yer)',t.kapasite)+alan('tIlk','İlk saat ücreti',t.ilkSaat)+alan('tSonraki','Sonraki saat ücreti',t.sonrakiSaat)+alan('tMax','Günlük en fazla (0 = sınır yok)',t.gunlukMax)+alan('tAylik','Aylık abonelik',t.aboneAylik)+alan('tHaftalik','Haftalık abonelik',t.aboneHaftalik)+'</div>'+
    '<button class="btn tam" style="margin-top:12px" onclick="tarifeKaydet()">Tarifeyi kaydet</button></div>'+
    '<div class="kart"><h3 style="font-size:21px">Yıkama hizmetleri</h3><div class="soluk">Fiyatları araç sınıfına göre girin. Değişiklik hemen kaydedilir.</div>'+
    D.ayar.hizmetler.map((h,i)=>'<div class="hzSatir"><div class="ustSatir"><input id="hz_i'+i+'" value="'+esc(h.isim)+'" onchange="hizDeg('+i+')" style="font-weight:600"><button class="kapat" style="margin-left:8px;flex:none" onclick="hizSil('+i+')" aria-label="Sil">×</button></div>'+
      '<div class="uc"><div><label>Binek</label><input id="hz_b'+i+'" type="number" inputmode="decimal" value="'+((h.fiyat||{}).binek||0)+'" onchange="hizDeg('+i+')"></div><div><label>SUV</label><input id="hz_s'+i+'" type="number" inputmode="decimal" value="'+((h.fiyat||{}).suv||0)+'" onchange="hizDeg('+i+')"></div><div><label>Ticari</label><input id="hz_t'+i+'" type="number" inputmode="decimal" value="'+((h.fiyat||{}).ticari||0)+'" onchange="hizDeg('+i+')"></div></div><button class="btn ikincil kucuk" style="margin-top:8px" onclick="sarfAc('+i+')">Ürün sarfı'+((h.sarf&&h.sarf.length)?' ('+h.sarf.length+' ürün)':'')+'</button></div>').join('')+
    '<button class="btn ikincil tam" style="margin-top:12px" onclick="hizEkle()">Hizmet ekle</button></div>'+
    '<div class="kart"><h3 style="font-size:21px;margin-bottom:8px">Gider kategorileri</h3>'+
    D.ayar.giderKat.map((k,i)=>'<span class="etiket">'+esc(k)+'<button onclick="katSil('+i+')" aria-label="Sil">×</button></span>').join('')+
    '<div class="arama" style="margin-top:6px"><input id="yeniKat" placeholder="Yeni kategori"><button class="btn" onclick="katEkle()">Ekle</button></div></div>'+
    '<div class="kart"><h3 style="font-size:21px;margin-bottom:4px">Personel isimleri</h3><div class="soluk" style="margin-bottom:8px">Giderlerde personel seçmek için isim listesi. Giriş hesabı gerekmez.</div>'+
    (D.ayar.calisanlar||[]).map((k,i)=>'<span class="etiket">'+esc(k)+'<button onclick="calSil('+i+')" aria-label="Sil">×</button></span>').join('')+
    '<div class="arama" style="margin-top:6px"><input id="yeniCal" placeholder="Ad Soyad"><button class="btn" onclick="calEkle()">Ekle</button></div></div>'+
    (D.ayar.sifirlandi?'':'<div class="kart"><h3 style="font-size:21px;margin-bottom:4px">Verileri sıfırla</h3><div class="soluk" style="margin-bottom:10px">Test kayıtlarını tek seferde temizlemek için. Bir kez kullanılabilir.</div><button class="btn tehlike tam" onclick="sifirlaAc()">Verileri sıfırla…</button></div>')+
    (FIREBASE_KULLAN?hesapKartlari():yerelKart());
}
function hesapKartlari(){
  return '<div class="kart"><h3 style="font-size:21px">Yöneticiler</h3><div class="soluk" style="margin-bottom:8px">Yönetici her şeyi görür ve ayarları değiştirir. Önce hesabı Firebase konsolunda (Authentication, Add user) oluşturun, sonra e-postasını buraya ekleyin.</div>'+
    '<span class="etiket">'+esc(D.ayar.ownerEmail||'')+' (ana yönetici)</span>'+
    (D.ayar.yoneticiler||[]).map((m,i)=>'<span class="etiket">'+esc(m)+'<button onclick="yonSil('+i+')" aria-label="Sil">×</button></span>').join('')+
    '<div class="arama" style="margin-top:6px"><input id="yeniYon" type="email" placeholder="yonetici@eposta.com"><button class="btn" onclick="yonEkle()">Ekle</button></div></div>'+
    '<div class="kart"><h3 style="font-size:21px">Personel</h3><div class="soluk" style="margin-bottom:8px">Personelin hesabını Firebase konsolunda (Authentication, Add user) oluşturun, sonra e-postasını buraya ekleyin. Personel kasa ve ayarları göremez.</div>'+
    (D.ayar.personel||[]).map((m,i)=>'<span class="etiket">'+esc(m)+'<button onclick="persSil('+i+')" aria-label="Sil">×</button></span>').join('')+
    '<div class="arama" style="margin-top:6px"><input id="yeniPers" type="email" placeholder="personel@eposta.com"><button class="btn" onclick="persEkle()">Ekle</button></div></div>'+
    '<div class="kart"><div class="satir"><span>Hesap</span><b>'+esc(user?user.email:'')+'</b></div><div class="satir"><span>Yetki</span><b>'+(rol==='admin'?'Yönetici':'Personel')+'</b></div>'+
    '<button class="btn tehlike tam" style="margin-top:12px" onclick="cikisYap()">Çıkış yap</button></div>';
}
function sayi(id){return Math.max(0,parseFloat($(id).value)||0)}
function tarifeKaydet(){
  ayarYaz({tarife:{ucretsizDk:sayi('tUcretsiz'),kapasite:Math.round(sayi('tKap')),ilkSaat:sayi('tIlk'),sonrakiSaat:sayi('tSonraki'),gunlukMax:sayi('tMax'),aboneAylik:sayi('tAylik'),aboneHaftalik:sayi('tHaftalik')}});
  toast('Tarife kaydedildi');
}
function hizDeg(i){
  const l=JSON.parse(JSON.stringify(D.ayar.hizmetler));
  l[i].isim=$('hz_i'+i).value.trim()||l[i].isim;
  l[i].fiyat={binek:sayi('hz_b'+i),suv:sayi('hz_s'+i),ticari:sayi('hz_t'+i)};
  ayarYaz({hizmetler:l});
}
function hizSil(i){
  if(!confirm('Bu hizmet silinsin mi?'))return;
  const l=D.ayar.hizmetler.slice();l.splice(i,1);ayarYaz({hizmetler:l});
}
function hizEkle(){
  sheetAc('Hizmet ekle',
    '<label>Hizmet adı</label><input id="nhIsim" placeholder="Örn. Motor yıkama">'+
    '<div class="iki"><div><label>Binek</label><input id="nhB" type="number" inputmode="decimal"></div><div><label>SUV</label><input id="nhS" type="number" inputmode="decimal"></div></div>'+
    '<label>Ticari</label><input id="nhT" type="number" inputmode="decimal">'+
    '<button class="btn tam" style="margin-top:14px" onclick="hizEkleKaydet()">Ekle</button>');
}
function hizEkleKaydet(){
  const isim=$('nhIsim').value.trim();
  if(!isim){toast('Hizmet adı girin');return}
  const l=D.ayar.hizmetler.slice();
  l.push({id:'h'+yeniId(),isim:isim,fiyat:{binek:sayi('nhB'),suv:sayi('nhS'),ticari:sayi('nhT')}});
  ayarYaz({hizmetler:l});sheetKapat();toast('Hizmet eklendi');
}
function katEkle(){
  const v=$('yeniKat').value.trim();if(!v)return;
  const l=D.ayar.giderKat.slice();if(l.indexOf(v)<0)l.push(v);ayarYaz({giderKat:l});
}
function katSil(i){const l=D.ayar.giderKat.slice();l.splice(i,1);ayarYaz({giderKat:l})}
function persEkle(){
  const v=$('yeniPers').value.trim().toLowerCase();if(!v||v.indexOf('@')<0){toast('Geçerli e-posta girin');return}
  const l=(D.ayar.personel||[]).slice();if(l.indexOf(v)<0)l.push(v);ayarYaz({personel:l});
}
function yonEkle(){
  const v=$('yeniYon').value.trim().toLowerCase();if(!v||v.indexOf('@')<0){toast('Geçerli e-posta girin');return}
  if(v===(D.ayar.ownerEmail||'').toLowerCase()){toast('Bu hesap zaten ana yönetici');return}
  const l=(D.ayar.yoneticiler||[]).slice();if(l.indexOf(v)<0)l.push(v);
  const p=(D.ayar.personel||[]).filter(x=>String(x).toLowerCase()!==v);
  ayarYaz({yoneticiler:l,personel:p});toast('Yönetici eklendi');
}
function yonSil(i){if(!confirm('Bu kişinin yönetici yetkisi kaldırılsın mı?'))return;const l=(D.ayar.yoneticiler||[]).slice();l.splice(i,1);ayarYaz({yoneticiler:l})}
function persSil(i){const l=(D.ayar.personel||[]).slice();l.splice(i,1);ayarYaz({personel:l})}

// ===================== BAŞLANGIÇ =====================
$('perde').addEventListener('click',e=>{if(e.target===$('perde'))sheetKapat()});
$('gSifre').addEventListener('keydown',e=>{if(e.key==='Enter')girisYap()});
function cevrimiciGuncelle(){$('nokta').classList.toggle('kapali',!navigator.onLine);$('nokta').title=navigator.onLine?'Çevrimiçi':'Çevrimdışı'}
window.addEventListener('online',cevrimiciGuncelle);window.addEventListener('offline',cevrimiciGuncelle);
cevrimiciGuncelle();
setInterval(()=>{
  if(!user)return;
  if(tarihKey(Date.now())!==bugunKey){kasaBugunDinle();if(kPer!=='ozel'){donemHesapla();kasaRaporDinle()}}
  if(!$('perde').classList.contains('on'))ciz();
},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth&&auth.currentUser)auth.currentUser.getIdToken().catch(()=>{})});
baslat();
</script>
